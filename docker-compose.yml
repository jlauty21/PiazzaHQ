# Piazza HQ — the device app server, in a container.
# Quick start:  docker compose up -d   then open  http://<this-host>:3000/app
# Full notes:   docker/README.md
#
# To update:    docker compose pull && docker compose up -d
#               (the in-app updater is disabled in a container by design)

services:
  piazzahq:
    # :latest  = the current stable (what you want unless you're beta-testing)
    # :beta    = the current beta   (opt in by changing this one line, then
    #            `docker compose pull && docker compose up -d`)
    image: ghcr.io/jlauty21/piazzahq:latest
    container_name: piazzahq
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - piazzahq-data:/data
    environment:
      # Set to your zone (e.g. America/Chicago). Affects server-side date
      # logic; you can also set Timezone in Settings once it's running.
      - TZ=UTC

    # ── LAN / Home Assistant / Tailscale ────────────────────────────────
    # Bridge networking (the default above) is fine for public calendar
    # feeds, weather, news and updates. If you need the app to *discover*
    # devices on your LAN, reach Home Assistant by hostname (homeassistant
    # .local), or use Tailscale the way it works on a Pi, drop the `ports:`
    # block above and use host networking instead:
    #
    #   network_mode: host
    #
    # (with host networking the app is on the host's :3000 directly, and
    # `ports:` is ignored — remove it to avoid a warning.)

volumes:
  piazzahq-data:
